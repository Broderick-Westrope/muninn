version: 2

project_name: muninn

before:
  hooks:
    - go mod tidy

builds:
  - id: muninn
    binary: muninn
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - arm64
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/broderick-westrope/muninn/internal/cli.Version={{ .Version }}
  # Installed next to muninn: `muninn mcp` execs it so each MCP session's
  # forwarder doesn't carry Zoekt's package-init memory.
  - id: muninn-mcp-proxy
    binary: muninn-mcp-proxy
    main: ./cmd/muninn-mcp-proxy
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - arm64
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  # ProjectName, not Binary: the archive holds two binaries.
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*

release:
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

brews:
  - repository:
      owner: "Broderick-Westrope"
      name: homebrew-tap
      token: "{{ .Env.GITHUB_TOKEN }}"
    commit_author:
      name: "Brodie Westrope"
      email: "brodie.westrope@gmail.com"
    homepage: "https://github.com/Broderick-Westrope/muninn"
    description: "Code search index and MCP server for your GitHub repos"
    license: "MIT"
    # The default installs only one binary; muninn mcp looks for the proxy
    # next to its own resolved path.
    install: |
      bin.install "muninn"
      bin.install "muninn-mcp-proxy"
    dependencies:
      - name: git
      - name: universal-ctags
    caveats: |
      Create ~/.config/muninn/config.json (see the README for the schema), then:
        muninn sync             # first sync: clone mirrors + build the index
        muninn sync --install   # schedule syncs via launchd (hourly by default)

      Add to your agent's MCP config:
        { "command": "muninn", "args": ["mcp"] }
    test: |
      system "#{bin}/muninn", "--version"
